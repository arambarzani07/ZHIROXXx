name: temp-v11-build
on:
  push:
    branches:
      - temp-kanychnar-v11-exe-build
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose payload characters
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('temp-min-v11/chunk000.b64','temp-min-v11/chunk001.b64','temp-min-v11/chunk002-003.b64','temp-min-v11/chunk004-005.b64','temp-min-v11/chunk006-007.b64','temp-min-v11/chunk008.b64','temp-min-v11/chunk009.b64','temp-min-v11/chunk010.b64','temp-min-v11/chunk011.b64','temp-min-v11/chunk012.b64')
          foreach ($file in $files) {
            $s = Get-Content -Raw -LiteralPath $file
            $cleanWs = $s -replace '\s',''
            $invalid = [regex]::Matches($cleanWs,'[^A-Za-z0-9+/=]')
            Write-Host ('FILE=' + $file + ' RAW=' + $s.Length + ' NOWS=' + $cleanWs.Length + ' MOD4=' + ($cleanWs.Length % 4) + ' INVALID=' + $invalid.Count)
            foreach ($m in $invalid) {
              Write-Host (' INVALID index=' + $m.Index + ' char=[' + $m.Value + '] code=' + [int][char]$m.Value)
            }
            Write-Host (' HEAD=' + $cleanWs.Substring(0,[Math]::Min(60,$cleanWs.Length)))
            Write-Host (' TAIL=' + $cleanWs.Substring([Math]::Max(0,$cleanWs.Length-60)))
          }
