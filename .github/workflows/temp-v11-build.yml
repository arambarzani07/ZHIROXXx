name: temp-v11-build
on:
  push:
    branches:
      - temp-kanychnar-v11-exe-build
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan independent later ZIP blocks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64, pathlib, struct, zlib, binascii
          root=pathlib.Path('temp-build-v11p')
          alphabet=set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          def rd(n):
              p=root/f'chunk{n:03d}.b64'
              if not p.exists(): return None
              s=''.join(p.read_text().split())
              s=''.join(c for c in s if c in alphabet)
              return s

          for i in range(10,21):
              s=rd(i)
              print('CHUNK',i,'LEN',None if s is None else len(s),'MOD4',None if s is None else len(s)%4)

          def scan_block(label, text, global_base):
              # Decode only full quartets. This gives the exact bytes for this global Base64 interval.
              text=text[:len(text)//4*4]
              try: b=base64.b64decode(text,validate=True)
              except Exception as e:
                  print(label,'DECODE_FAIL',e); return []
              print('\nBLOCK',label,'BYTES',len(b),'GLOBAL_BASE',global_base)
              found=[]
              start=0
              while True:
                  p=b.find(b'PK\x03\x04',start)
                  if p<0: break
                  start=p+1
                  if p+30>len(b): continue
                  try:
                      ver,flags,method,mt,md,crc,cs,us,fn,xl=struct.unpack_from('<5H3I2H',b,p+4)
                  except: continue
                  if fn<1 or fn>1000 or xl>10000 or cs>10_000_000: continue
                  ds=p+30+fn+xl; end=ds+cs
                  if end>len(b): continue
                  name=b[p+30:p+30+fn].decode('utf-8','replace')
                  try:
                      comp=b[ds:end]
                      if method==0: raw=comp
                      elif method==8: raw=zlib.decompress(comp,-15)
                      else: continue
                      if len(raw)!=us or (binascii.crc32(raw)&0xffffffff)!=crc: continue
                  except: continue
                  found.append((global_base+p,global_base+end,name,raw))
              for a,e,n,raw in found:
                  print(f'RECOVER {a:8d}..{e:8d} {len(raw):6d} {n}')
              return found

          recovered=[]
          # clean single chunk 010 => base64 160000..176000 => binary 120000..132000
          s10=rd(10)
          if s10: recovered += scan_block('010',s10,120000)
          # chunk011 is missing. chunks012+013 are clean contiguous => b64 192000..224000 => bytes 144000..168000
          s12,s13=rd(12),rd(13)
          if s12 and s13 and len(s12)==16000 and len(s13)==16000:
              recovered += scan_block('012+013',s12+s13,144000)
          # chunk014 may have +2; diagnose but don't trust yet. chunk016 is clean standalone => b64 256000..272000 => bytes 192000..204000
          s16=rd(16)
          if s16 and len(s16)==16000:
              recovered += scan_block('016',s16,192000)

          print('\nTOTAL_RECOVERABLE_LATER',len(recovered))
          print('---SOURCE_ONLY---')
          for a,e,n,raw in recovered:
              if '/src/' in n or n.endswith('.sln'):
                  print(n)
          '@ | Set-Content scan_later.py -Encoding UTF8
          python scan_later.py
