name: temp-v11-build
on:
  push:
    branches:
      - temp-kanychnar-v11-exe-build
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve chunk007 and extend recoverable ZIP prefix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64, pathlib, struct, zlib, binascii
          root=pathlib.Path('temp-build-v11p')
          def rd(i):
              s=''.join((root/f'chunk{i:03d}.b64').read_text().split())
              return ''.join(c for c in s if c in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          c={i:rd(i) for i in range(10)}
          # chunk004 repair is uniquely proven: extra character is the final char.
          assert len(c[4])==16001
          c4=c[4][:-1]
          base=''.join(c[i] for i in range(4))+c4+c[5]+c[6]

          def scan(b):
              p=0; out=[]
              while p+30<=len(b) and b[p:p+4]==b'PK\x03\x04':
                  ver,flags,method,mt,md,crc,cs,us,fn,xl=struct.unpack_from('<5H3I2H',b,p+4)
                  if fn>1000 or xl>10000 or cs>10_000_000: break
                  name=b[p+30:p+30+fn].decode('utf-8','replace')
                  ds=p+30+fn+xl; end=ds+cs
                  if end>len(b): break
                  try:
                      comp=b[ds:end]
                      raw=comp if method==0 else zlib.decompress(comp,-15) if method==8 else None
                      if raw is None or len(raw)!=us or (binascii.crc32(raw)&0xffffffff)!=crc: break
                  except: break
                  out.append((p,end,name)); p=end
              return p,out

          c7=c[7]; c8=c[8]; c9=c[9]
          assert len(c7)==16004 and len(c8)==16000
          # chunk009 is a prefix capture; trim final incomplete Base64 quartet only.
          c9p=c9[:len(c9)//4*4]
          best=(-1,-1,None,None)
          ties=[]
          for pos in range(10278,len(c7)-3):
              r7=c7[:pos]+c7[pos+4:]
              text=base+r7+c8+c9p
              try: b=base64.b64decode(text,validate=True)
              except: continue
              end,entries=scan(b)
              score=(end,len(entries))
              if score>best[:2]: best=(end,len(entries),pos,entries); ties=[pos]
              elif score==best[:2]: ties.append(pos)
          print('BEST_END',best[0],'COUNT',best[1],'POS',best[2],'TIES',len(ties),'FIRST_TIES',ties[:30])
          entries=best[3]
          print('--- RECOVERABLE SOURCE ENTRIES ---')
          for a,b,n in entries:
              if '/src/' in n or n.endswith('.sln'):
                  print(f'{a:8d}..{b:8d} {n}')
          print('--- LAST 50 ENTRIES ---')
          for x in entries[-50:]: print(x[2])
          '@ | Set-Content extend_secondary.py -Encoding UTF8
          python extend_secondary.py
