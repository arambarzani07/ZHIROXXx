name: temp-v11-build
on:
  push:
    branches:
      - temp-kanychnar-v11-exe-build
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan secondary payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64, pathlib, re, struct, zlib

          root=pathlib.Path('temp-build-v11p')
          names=['chunk000.b64','chunk001.b64','chunk002.b64','chunk003.b64','chunk004.b64','chunk005.b64','chunk006.b64','chunk007.b64','chunk008.b64','chunk009.b64']
          parts=[]
          for n in names:
              s=''.join((root/n).read_text().split())
              bad=[(i,c,ord(c)) for i,c in enumerate(s) if c not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=']
              print(n,'LEN',len(s),'MOD4',len(s)%4,'BAD',bad[:20])
              # Strip only non-base64 display markers. For chunks with extra base64-valid chars,
              # preserve the longest prefix that maintains the expected 16000-char boundary.
              s=''.join(c for c in s if c in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
              if n in ('chunk004.b64','chunk007.b64') and len(s)>16000:
                  # test simple removal candidates near boundary/middle later; print context first
                  print(n,'EXTRA',len(s)-16000,'HEAD',s[:40],'TAIL',s[-40:])
              parts.append(s)

          # Build a conservative prefix only through fully clean chunks 000-003.
          prefix=''.join(parts[:4])
          assert len(prefix)==64000, len(prefix)
          b=base64.b64decode(prefix)
          print('PREFIX_BYTES',len(b))

          # Sequentially parse local ZIP records available in intact prefix.
          p=0; count=0
          print('RECOVERABLE_ENTRIES_FROM_CLEAN_PREFIX:')
          while p+30 <= len(b) and b[p:p+4]==b'PK\x03\x04':
              ver,flags,method,mt,md,crc,csize,usize,fnlen,xlen=struct.unpack_from('<5H3I2H',b,p+4)
              name=b[p+30:p+30+fnlen].decode('utf-8','replace')
              data_start=p+30+fnlen+xlen
              end=data_start+csize
              if end>len(b):
                  print('PARTIAL_ENTRY',p,name,'needs_end',end,'prefix_end',len(b)); break
              print(f'{p:8d}..{end:8d} {method} {csize:6d} {usize:6d} {name}')
              p=end; count+=1
          print('RECOVERABLE_COUNT',count,'NEXT_OFFSET',p,'PREFIX_END',len(b))
          '@ | Set-Content scan_secondary.py -Encoding UTF8
          python scan_secondary.py
