name: temp-v11-build
on:
  push:
    branches:
      - temp-kanychnar-v11-exe-build
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build placeholder ZIP and map missing ranges
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64, pathlib, struct

          def clean(path):
              return ''.join(pathlib.Path(path).read_text().split())

          a0=clean('temp-min-v11/chunk000.b64')
          a1=clean('temp-min-v11/chunk001.b64')
          a23=clean('temp-min-v11/chunk002-003.b64')
          a45=clean('temp-min-v11/chunk004-005.b64')
          a67=clean('temp-min-v11/chunk006-007.b64')
          a8=clean('temp-min-v11/chunk008.b64')
          a10=clean('temp-min-v11/chunk010.b64')
          a11=clean('temp-min-v11/chunk011.b64')
          a12=clean('temp-min-v11/chunk012.b64')

          # remove the known 21-char display truncation markers
          a45=a45[:10000]+a45[10021:]
          a67=a67[:10000]+a67[10021:]
          assert len(a23)==10000
          assert len(a45)==20000
          assert len(a67)==20000

          # Recreate the exact expected Base64 positions. Unknown ranges are A placeholders.
          # chunk002-003 was captured as first 5000 + last 5000 chars.
          s=(a0+a1+
             a23[:5000]+'A'*22000+a23[5000:]+
             a45[:10000]+'A'*12000+a45[10000:]+
             a67[:10000]+'A'*12000+a67[10000:]+
             a8+
             'A'*16000+
             a10+a11+a12)
          print('EXPECTED_B64_LEN',len(s))
          assert len(s)==206056, len(s)
          b=base64.b64decode(s)
          print('PLACEHOLDER_ZIP_BYTES',len(b))

          # Missing/unknown ranges in decoded ZIP byte coordinates.
          holes=[
              (37000//4*3,59000//4*3,'missing chunk002-003 middle'),
              (74000//4*3,86000//4*3,'missing chunk004-005 middle'),
              (106000//4*3,118000//4*3,'missing chunk006-007 middle'),
              (144000//4*3,160000//4*3,'chunk009 unknown'),
          ]
          print('HOLES',holes)

          eocd=b.rfind(b'PK\x05\x06')
          if eocd<0: raise SystemExit('EOCD not found')
          disk,cd_disk,n_disk,n_total,cd_size,cd_off,comment_len=struct.unpack_from('<HHHHIIH',b,eocd+4)
          print('EOCD',eocd,'entries',n_total,'cd_off',cd_off,'cd_size',cd_size)
          entries=[]
          p=cd_off
          for i in range(n_total):
              if b[p:p+4]!=b'PK\x01\x02':
                  raise SystemExit(f'central signature missing at {p} entry {i}: {b[p:p+8]!r}')
              fields=struct.unpack_from('<6H3I5H2I',b,p+4)
              # fields: made,need,flags,method,time,date,crc,csize,usize,fnlen,xlen,clen,disk,intattr,extattr,loff
              csize=fields[7]; usize=fields[8]; fnlen=fields[9]; xlen=fields[10]; clen=fields[11]; loff=fields[15]
              name_bytes=b[p+46:p+46+fnlen]
              try: name=name_bytes.decode('utf-8')
              except: name=name_bytes.decode('cp437','replace')
              entries.append((loff,name,csize,usize))
              p += 46+fnlen+xlen+clen
          entries.sort()
          print('CENTRAL_END',p)
          print('\nIMPACTED ZIP ENTRIES:')
          impacted=[]
          for idx,(loff,name,csize,usize) in enumerate(entries):
              end=entries[idx+1][0] if idx+1<len(entries) else cd_off
              hit=[]
              for hs,he,label in holes:
                  if loff < he and end > hs:
                      hit.append(label)
              if hit:
                  impacted.append(name)
                  print(f'{loff:8d}..{end:8d}  {name}  :: {", ".join(hit)}')
          print('IMPACTED_COUNT',len(impacted))
          print('---ALL IMPACTED NAMES---')
          for x in impacted: print(x)
          '@ | Set-Content map_zip.py -Encoding UTF8
          python map_zip.py
