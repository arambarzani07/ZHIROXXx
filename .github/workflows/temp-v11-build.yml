name: temp-v11-build
on:
  push:
    branches:
      - temp-kanychnar-v11-exe-build
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover chunk014 and chunk015 source entries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64, pathlib, struct, zlib, binascii
          root=pathlib.Path('temp-build-v11p')
          alpha=set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          def rd(i):
              s=''.join((root/f'chunk{i:03d}.b64').read_text().split())
              return ''.join(c for c in s if c in alpha)
          c14=rd(14); c15=rd(15)
          print('LENS',len(c14),len(c15))
          assert len(c14)==16002 and len(c15)==8320
          def scan(b):
              found=[]; start=0
              while True:
                  p=b.find(b'PK\x03\x04',start)
                  if p<0: break
                  start=p+1
                  if p+30>len(b): continue
                  try: ver,flags,method,mt,md,crc,cs,us,fn,xl=struct.unpack_from('<5H3I2H',b,p+4)
                  except: continue
                  if fn<1 or fn>1000 or xl>10000 or cs>10000000: continue
                  ds=p+30+fn+xl; end=ds+cs
                  if end>len(b): continue
                  name=b[p+30:p+30+fn].decode('utf-8','replace')
                  try:
                      comp=b[ds:end]
                      raw=comp if method==0 else zlib.decompress(comp,-15) if method==8 else None
                      if raw is None or len(raw)!=us or (binascii.crc32(raw)&0xffffffff)!=crc: continue
                  except: continue
                  found.append((p,end,name,len(raw)))
              return found
          best=(-1,-1,-1,None)
          ties=[]
          for pos in range(len(c14)-1):
              r=c14[:pos]+c14[pos+2:]
              try: b=base64.b64decode(r+c15,validate=True)
              except: continue
              f=scan(b)
              score=(len(f),sum(x[3] for x in f),max([x[1] for x in f],default=0))
              if score>best[:3]: best=(*score,pos); ties=[(pos,f)]
              elif score==best[:3]: ties.append((pos,f))
          print('BEST',best,'TIES',len(ties),'POSITIONS',[x[0] for x in ties[:40]])
          pos,found=ties[0]
          r=c14[:pos]+c14[pos+2:]
          b=base64.b64decode(r+c15,validate=True)
          print('REPAIR_POS',pos,'BLOCK_BYTES',len(b),'GLOBAL_BASE',168000)
          for p,e,n,usize in found:
              print(f'RECOVER {168000+p:8d}..{168000+e:8d} {usize:6d} {n}')
          '@ | Set-Content recover_1415.py -Encoding UTF8
          python recover_1415.py
